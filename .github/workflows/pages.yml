name: Refresh NAV + deploy Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 13 * * *" # 20:00 giờ VN, sau khi fmarket cập nhật NAV
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: pages

# 1 job duy nhất: push bằng GITHUB_TOKEN không trigger được workflow khác,
# và job có `needs` sẽ bị skip theo khi bước refresh bị skip trên sự kiện push.
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # Push bị từ chối (vừa có commit từ web) thì để run fail; lần chạy sau checkout lại từ đầu.
      # Không rebase/merge file mã hoá.
      - name: Refresh NAV
        if: github.event_name != 'push'
        env:
          CCQ_PASSPHRASE: ${{ secrets.CCQ_PASSPHRASE }}
        run: |
          npm run refresh-nav
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: refresh NAV"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
